name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # Pinned: ubuntu-latest moved to an image that has no Python 3.9, the oldest version the scripts support.
        os: [ubuntu-24.04, macos-15]
        python: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Build every example
        run: |
          for spec in examples/*.json; do
            python scripts/wiring.py build "$spec" --out "$RUNNER_TEMP/out/$(basename "$spec" .json)"
          done
